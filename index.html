<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f6f2">
<title>MY SPACE</title>
<style>
:root{
 --bg:#f7f6f2;--card:#fffefa;--text:#25272b;
 --muted:#858990;--blue:#c9e2f1;--blue2:#edf5f9;
 --line:#e9e8e3;--gold:#b69a62;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
 font-family:Arial,sans-serif}
header{padding:27px 20px 17px;text-align:center}
h1{font-size:25px;letter-spacing:5px;margin:0;font-weight:500}
.subtitle{font-size:10px;letter-spacing:3px;color:var(--muted);margin-top:8px}
nav{display:flex;justify-content:center;gap:9px;padding:8px 12px 20px}
nav button,.btn{border:1px solid var(--line);background:var(--card);
 padding:11px 16px;border-radius:22px;color:var(--text);font-size:13px}
nav button.active,.primary{background:var(--blue);border-color:var(--blue)}
main{max-width:720px;margin:auto;padding:0 15px 40px}
.panel{display:none}.panel.active{display:block}
.section-title{font-size:19px;font-weight:500;margin:12px 0 16px}
.calendar{background:var(--card);border:1px solid var(--line);
 border-radius:18px;padding:16px;margin-bottom:18px}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.cal-head button{border:0;background:var(--blue2);border-radius:50%;
 width:34px;height:34px;font-size:18px}
#monthTitle{font-size:15px}
.week,.days{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:5px}
.week span{font-size:11px;color:var(--muted);padding:7px 0}
.day{border:0;background:transparent;min-height:39px;border-radius:12px;
 position:relative;font-size:13px;color:var(--text)}
.day.selected{background:var(--blue)}
.day.today{outline:1px solid var(--gold)}
.day.has-entry:after{content:"";position:absolute;bottom:4px;left:calc(50% - 3px);
 width:6px;height:6px;border-radius:50%;background:#91c7e4}
.selected-date{font-size:13px;color:var(--muted);margin:14px 0}
.card{background:var(--card);border:1px solid var(--line);
 border-radius:18px;padding:15px;margin-bottom:14px}
.entry-photo{width:100%;max-height:300px;object-fit:cover;
 border-radius:13px;margin-bottom:12px}
.entry-date{font-size:11px;color:var(--muted);margin-bottom:8px}
.entry-category{font-size:11px;color:#7299ae;letter-spacing:1px;text-transform:uppercase}
.entry-text{font-size:14px;line-height:1.55;white-space:pre-wrap;margin:10px 0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.actions button{font-size:12px;padding:9px 13px;border-radius:18px;
 border:1px solid var(--line);background:white}
.form{background:var(--card);border:1px solid var(--line);
 border-radius:18px;padding:17px;margin-bottom:18px}
label{display:block;font-size:12px;color:var(--muted);margin:13px 0 6px}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);
 border-radius:11px;background:#fffefa;font:14px Arial;color:var(--text)}
textarea{min-height:110px;resize:vertical}
.form button{margin-top:15px}
button{cursor:pointer}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:25px 10px}
.photo-preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.photo-preview img{width:75px;height:75px;object-fit:cover;border-radius:10px}
.mood-options{display:flex;gap:8px;flex-wrap:wrap}
.mood-options button{border:1px solid var(--line);background:white;
 border-radius:20px;padding:8px 12px}
.mood-options button.chosen{background:var(--blue);border-color:var(--blue)}
#modal{display:none;position:fixed;inset:0;background:#0008;
 z-index:10;padding:18px;overflow:auto}
.modal-box{max-width:600px;margin:35px auto;background:var(--card);
 border-radius:18px;padding:18px}
.modal-box img{width:100%;border-radius:12px;margin:7px 0;object-fit:cover}
.close{float:right;border:0;background:var(--blue2);padding:9px 13px;border-radius:20px}
.small{font-size:11px;color:var(--muted)}
</style>
</head>
<body>

<header>
<h1>MY SPACE</h1>
<div class="subtitle">MY PERSONAL SPACE</div>
</header>

<nav>
<button class="active" onclick="showTab('diary',this)">Дневник</button>
<button onclick="showTab('inspiration',this)">Вдохновение</button>
<button onclick="showTab('new',this)">Новая запись +</button>
</nav>

<main>
<section id="diary" class="panel active">
<div class="section-title">Мой дневник</div>
<div class="calendar">
 <div class="cal-head">
  <button onclick="changeMonth(-1)">‹</button>
  <span id="monthTitle"></span>
  <button onclick="changeMonth(1)">›</button>
 </div>
 <div class="week">
  <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span>
  <span>Пт</span><span>Сб</span><span>Вс</span>
 </div>
 <div class="days" id="calendarDays"></div>
</div>
<div class="selected-date" id="selectedDate"></div>
<div id="entriesList"></div>
</section>

<section id="new" class="panel">
<div class="section-title" id="formTitle">Новая запись</div>
<div class="form">
 <label>Дата</label>
 <input type="date" id="entryDate">
 <label>Категория</label>
 <select id="entryCategory">
  <option>Мои мысли</option><option>События</option>
  <option>Спорт</option><option>Путешествия</option>
  <option>Красота</option><option>Другое</option>
 </select>
 <label>Настроение</label>
 <div class="mood-options" id="moodOptions">
  <button type="button" onclick="chooseMood(this,'😊')">😊</button>
  <button type="button" onclick="chooseMood(this,'🥰')">🥰</button>
  <button type="button" onclick="chooseMood(this,'😌')">😌</button>
  <button type="button" onclick="chooseMood(this,'😐')">😐</button>
  <button type="button" onclick="chooseMood(this,'😔')">😔</button>
  <button type="button" onclick="chooseMood(this,'😡')">😡</button>
 </div>
 <label>Мои мысли и воспоминания</label>
 <textarea id="entryText" placeholder="Запиши всё, что хочется сохранить..."></textarea>
 <label>Фотографии</label>
 <input type="file" id="entryPhotos" accept="image/*" multiple>
 <div class="photo-preview" id="photoPreview"></div>
 <button class="btn primary" onclick="saveEntry()">Сохранить запись</button>
 <button class="btn" onclick="cancelEdit()">Отмена</button>
</div>
</section>

<section id="inspiration" class="panel">
<div class="section-title">Доска вдохновения</div>
<div class="form">
 <label>Коллекция</label>
 <select id="boardCategory">
  <option>Интерьеры</option><option>Образы</option>
  <option>Съёмки</option><option>Макияж</option>
  <option>Места</option><option>Идеи</option>
 </select>
 <label>Название или заметка</label>
 <input id="boardText" placeholder="Например, идея для съёмки">
 <label>Фотография</label>
 <input type="file" id="boardPhoto" accept="image/*">
 <button class="btn primary" onclick="addBoard()">Добавить на доску</button>
</div>
<div id="boardList"></div>
</section>
</main>

<div id="modal">
 <div class="modal-box">
  <button class="close" onclick="closeModal()">Закрыть</button>
  <div id="modalContent"></div>
 </div>
</div>

<script>
const ENTRY_KEY='myspace_entries';
const MOOD_KEY='myspace_mood';
const BOARD_KEY='myspace_board';

let entries=JSON.parse(localStorage.getItem(ENTRY_KEY)||'[]');
let board=JSON.parse(localStorage.getItem(BOARD_KEY)||'[]');
let selectedMood='';
let selectedPhotos=[];
let editingId=null;
let currentDate=new Date();
let chosenDate=new Date();

function saveData(){
 localStorage.setItem(ENTRY_KEY,JSON.stringify(entries));
}
function showTab(id,button){
 document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
 document.getElementById(id).classList.add('active');
 document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
 if(button)button.classList.add('active');
 if(id==='diary'){renderCalendar();renderEntries()}
 if(id==='inspiration')renderBoard();
}
function dateKey(d){
 return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function changeMonth(n){
 currentDate.setMonth(currentDate.getMonth()+n);
 renderCalendar();
}
function renderCalendar(){
 const y=currentDate.getFullYear(),m=currentDate.getMonth();
 document.getElementById('monthTitle').textContent=
 new Date(y,m,1).toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
 const first=(new Date(y,m,1).getDay()+6)%7;
 const count=new Date(y,m+1,0).getDate();
 const today=dateKey(new Date()),selected=dateKey(chosenDate);
 let html='';
 for(let i=0;i<first;i++)html+='<span></span>';
 for(let d=1;d<=count;d++){
  const key=dateKey(new Date(y,m,d));
  const has=entries.some(e=>e.date===key);
  html+=`<button class="day ${key===selected?'selected':''} ${key===today?'today':''} ${has?'has-entry':''}" onclick="selectDay('${key}')">${d}</button>`;
 }
 document.getElementById('calendarDays').innerHTML=html;
}
function selectDay(key){
 chosenDate=new Date(key+'T12:00:00');
 renderCalendar();renderEntries();
}
function renderEntries(){
 const key=dateKey(chosenDate);
 document.getElementById('selectedDate').textContent=
 chosenDate.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
 const list=entries.filter(e=>e.date===key).sort((a,b)=>(b.id||0)-(a.id||0));
 const box=document.getElementById('entriesList');
 if(!list.length){box.innerHTML='<div class="empty">На эту дату записей пока нет.</div>';return}
 box.innerHTML=list.map(e=>{
  const photos=e.photos|| (e.photo?[e.photo]:[]);
  return `<div class="card">
   ${photos.length?`<img class="entry-photo" src="${photos[0]}">`:''}
   <div class="entry-date">${formatDate(e.date)} ${e.mood||''}</div>
   <div class="entry-category">${escapeHtml(e.category||'Мои мысли')}</div>
   <div class="entry-text">${escapeHtml(e.text||'')}</div>
   <div class="actions">
    <button onclick="openEntry(${e.id})">Открыть</button>
    <button onclick="editEntry(${e.id})">Изменить</button>
    <button onclick="deleteEntry(${e.id})">Удалить</button>
   </div>
  </div>`;
 }).join('');
}
function formatDate(s){
 if(!s)return '';
 const d=new Date(s+'T12:00:00');
 return d.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
}
function escapeHtml(s){
 return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function chooseMood(btn,mood){
 selectedMood=mood;
 document.querySelectorAll('.mood-options button').forEach(b=>b.classList.remove('chosen'));
 btn.classList.add('chosen');
}
document.getElementById('entryPhotos').addEventListener('change',async function(){
 const files=Array.from(this.files);
 for(const file of files){
  const data=await compressImage(file);
  selectedPhotos.push(data);
 }
 renderPhotoPreview();
 this.value='';
});
function compressImage(file){
 return new Promise(resolve=>{
  const reader=new FileReader();
  reader.onload=()=>{
   const img=new Image();
   img.onload=()=>{
    const canvas=document.createElement('canvas');
    const scale=Math.min(1200/img.width,1200/img.height,1);
    canvas.width=img.width*scale;canvas.height=img.height*scale;
    canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
    resolve(canvas.toDataURL('image/jpeg',0.75));
   };
   img.src=reader.result;
  };
  reader.readAsDataURL(file);
 });
}
function renderPhotoPreview(){
 document.getElementById('photoPreview').innerHTML=
 selectedPhotos.map((p,i)=>`<img src="${p}" onclick="removePhoto(${i})">`).join('');
}
function removePhoto(i){
 selectedPhotos.splice(i,1);renderPhotoPreview();
}
function saveEntry(){
 const date=document.getElementById('entryDate').value;
 const text=document.getElementById('entryText').value.trim();
 if(!date){alert('Выбери дату записи');return}
 if(!text&&!selectedPhotos.length){alert('Добавь текст или фотографию');return}
 const item={
  id:editingId||Date.now(),
  date,
  category:document.getElementById('entryCategory').value,
  mood:selectedMood,
  text,
  photos:selectedPhotos
 };
 if(editingId){
  const index=entries.findIndex(e=>e.id===editingId);
  if(index!==-1)entries[index]=item;
 }else entries.push(item);
 saveData();
 chosenDate=new Date(date+'T12:00:00');
 currentDate=new Date(chosenDate);
 resetForm();
 showTab('diary',document.querySelector('nav button'));
}
function resetForm(){
 editingId=null;selectedMood='';selectedPhotos=[];
 document.getElementById('entryDate').value=dateKey(new Date());
 document.getElementById('entryText').value='';
 document.getElementById('entryCategory').selectedIndex=0;
 document.getElementById('entryPhotos').value='';
 document.getElementById('photoPreview').innerHTML='';
 document.querySelectorAll('.mood-options button').forEach(b=>b.classList.remove('chosen'));
 document.getElementById('formTitle').textContent='Новая запись';
}
function cancelEdit(){resetForm();showTab('diary',document.querySelector('nav button'))}
function editEntry(id){
 const e=entries.find(x=>x.id===id);if(!e)return;
 editingId=id;
 document.getElementById('entryDate').value=e.date||dateKey(new Date());
 document.getElementById('entryCategory').value=e.category||'Мои мысли';
 document.getElementById('entryText').value=e.text||'';
 selectedMood=e.mood||'';
 selectedPhotos=e.photos|| (e.photo?[e.photo]:[]);
 document.querySelectorAll('.mood-options button').forEach(b=>{
  b.classList.toggle('chosen',b.textContent===selectedMood);
 });
 renderPhotoPreview();
 document.getElementById('formTitle').textContent='Изменить запись';
 showTab('new',document.querySelectorAll('nav button')[2]);
}
function deleteEntry(id){
 if(!confirm('Удалить эту запись?'))return;
 entries=entries.filter(e=>e.id!==id);
 saveData();renderCalendar();renderEntries();
}
function openEntry(id){
 const e=entries.find(x=>x.id===id);if(!e)return;
 const photos=e.photos|| (e.photo?[e.photo]:[]);
 document.getElementById('modalContent').innerHTML=
 `<h2>${formatDate(e.date)}</h2>
 <p class="small">${escapeHtml(e.category||'')} ${e.mood||''}</p>
 <p class="entry-text">${escapeHtml(e.text||'')}</p>
 ${photos.map(p=>`<img src="${p}">`).join('')}`;
 document.getElementById('modal').style.display='block';
}
function closeModal(){document.getElementById('modal').style.display='none'}
async function addBoard(){
 const file=document.getElementById('boardPhoto').files[0];
 const title=document.getElementById('boardText').value.trim();
 if(!file&&!title){alert('Добавь фотографию или заметку');return}
 const photo=file?await compressImage(file):'';
 board.push({id:Date.now(),category:document.getElementById('boardCategory').value,title,photo});
 localStorage.setItem(BOARD_KEY,JSON.stringify(board));
 document.getElementById('boardText').value='';
 document.getElementById('boardPhoto').value='';
 renderBoard();
}
function renderBoard(){
 const box=document.getElementById('boardList');
 if(!board.length){box.innerHTML='<div class="empty">Здесь будут твои идеи и вдохновение.</div>';return}
 box.innerHTML=board.slice().reverse().map(e=>
 `<div class="card">
 ${e.photo?`<img class="entry-photo" src="${e.photo}">`:''}
 <div class="entry-category">${escapeHtml(e.category||'')}</div>
 <div class="entry-text">${escapeHtml(e.title||'')}</div>
 <div class="actions"><button onclick="deleteBoard(${e.id})">Удалить</button></div>
 </div>`).join('');
}
function deleteBoard(id){
 if(!confirm('Удалить эту карточку?'))return;
 board=board.filter(e=>e.id!==id);
 localStorage.setItem(BOARD_KEY,JSON.stringify(board));renderBoard();
}
document.getElementById('entryDate').value=dateKey(new Date());
renderCalendar();
renderEntries();
renderBoard();
</script>
</body>
</html>
